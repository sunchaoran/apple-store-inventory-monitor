<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    拾果的应用图标源文件。所有平台的图标都由它生成：
      pnpm tauri icon assets/icon.svg
    暖白圆角底上一颗珊瑚红的果子，果子里的对勾表示「有货、拿到了」。
    外圈留出 100px 透明边距，与 macOS 图标网格一致。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF5"/>
      <stop offset="1" stop-color="#F8E7D3"/>
    </linearGradient>
    <linearGradient id="fruit" x1="0.2" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#FF7B5E"/>
      <stop offset="1" stop-color="#E2453B"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5CCB8A"/>
      <stop offset="1" stop-color="#2E9D63"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
    </filter>
    <filter id="body" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#body)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="185.5" fill="none" stroke="#000" stroke-opacity="0.07" stroke-width="2"/>
  <g filter="url(#lift)">
    <path d="M506 334 Q500 292 470 262" fill="none" stroke="#7A5134" stroke-width="24" stroke-linecap="round"/>
    <circle cx="512" cy="560" r="232" fill="url(#fruit)"/>
    <path d="M522 322 C552 252 618 214 684 214 C672 284 616 330 522 322 Z" fill="url(#leaf)"/>
  </g>
  <ellipse cx="420" cy="452" rx="66" ry="36" transform="rotate(-38 420 452)" fill="#fff" fill-opacity="0.18"/>
  <path d="M404 566 L486 646 L628 500" fill="none" stroke="#fff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
